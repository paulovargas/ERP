spring.datasource.jndi-name=java:/jdbc/erpdb
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
app.security.jwt.expiration-millis=86400000
app.security.initial-user.username=${ERP_INITIAL_USER:admin@admin.com}
app.security.initial-user.password=${ERP_INITIAL_PASSWORD:Admin123*}
app.default-user.name=${DEFAULT_ADMIN_NAME:Administrador}
app.default-user.email=${DEFAULT_ADMIN_EMAIL:admin@admin.com}
app.default-user.password=${DEFAULT_ADMIN_PASSWORD:${ERP_INITIAL_PASSWORD:}}
app.default-user.document=${DEFAULT_ADMIN_DOCUMENT:00000000000}
app.default-user.phone=${DEFAULT_ADMIN_PHONE:00000000000}
app.jwt.secret=${JWT_SECRET:crudcliente-local-dev-secret-32-chars}
app.jwt.expiration-millis=${JWT_EXPIRATION_MILLIS:86400000}
